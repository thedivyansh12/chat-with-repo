services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: repochat, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/repochat
      DB_USER: postgres
      DB_PASSWORD: postgres
      LLM_API_KEY: ${LLM_API_KEY}
volumes: { pgdata: {} }
