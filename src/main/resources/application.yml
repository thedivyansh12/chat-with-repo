server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repochat}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  ai:
    model:
      embedding: transformers      # runs inside the app: free, no API key, no rate limit
      chat: openai                 # OpenAI-compatible client, pointed at Gemini's free tier
    embedding:
      transformer:
        cache:
          directory: /tmp/onnx-cache
    openai:
      api-key: ${LLM_API_KEY}
      base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        completions-path: /chat/completions
        options:
          model: ${CHAT_MODEL:gemini-2.5-flash}
          temperature: 0.1
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 384            # all-MiniLM-L6-v2
        index-type: HNSW
